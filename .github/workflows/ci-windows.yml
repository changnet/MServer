# CI windows 构建 + 冒烟测试
#
# 触发方式：手动(workflow_dispatch) 或每周一次定时。不跟随每次 push，
# 因为 vcpkg 依赖是源码编译，冷启动要 30~40 分钟。
#
# 作业编排：
#   windows-deps  只做 vcpkg install/export，产物按 vcpkg.json 的 hash 缓存
#   windows       modules ON / OFF 两份配置，都依赖上面的缓存，不重复编译
#
# 测试只跑 json 相关用例(--filter "json lib test")：它 require 了 server/c_module
# 下的 cjson 动态库，能验证 lua c 模块(本地带来的 abi、加载路径、符号解析)是否正常。
# 其余用例依赖外网服务或数据库，不在 CI 里跑。
#
# linux 侧在 ci-linux.yml，两个文件用同一个 cron 触发。concurrency group 必须
# 分开：group 名字是仓库级共享的，同名会让两次定时运行互相排队。

name: CI windows

on:
  workflow_dispatch:
  schedule:
    # 每周一 03:17 UTC。GitHub 的 cron 是尽力而为，整点前后可能被延后
    - cron: '17 3 * * 1'

permissions:
  contents: read

# 允许同一分支上多个运行并存，但新的定时任务不打断正在跑的
concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # windows 的依赖是唯一的重活：openssl、mongo-c-driver、libmariadb、libpq
  # 全部从源码编。编完后 export 出来的树(~150M)按 project/vcpkg.json 的
  # hash 缓存：命中时后续作业只要解压一次，未命中才付出编译时间。
  # 单独成一个作业是为了让 modules ON/OFF 两个配置共用一次编译。
  # ------------------------------------------------------------------
  windows-deps:
    name: windows deps
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: restore vcpkg export
        id: cache
        uses: actions/cache@v4
        with:
          path: engine/vcpkg_win_x64/vcpkg-export
          key: vcpkg-win-x64-${{ hashFiles('project/vcpkg.json') }}

      # vcpkg.bat 内部会 cd 到项目根并按固定名字工作，第二个参数(vcpkg 根目录)
      # 省略表示用 PATH 里的 vcpkg，也不去 pull vcpkg 自身的仓库
      - name: vcpkg install
        if: steps.cache.outputs.cache-hit != 'true'
        shell: cmd
        run: shell\vcpkg.bat install

      - name: vcpkg export
        if: steps.cache.outputs.cache-hit != 'true'
        shell: cmd
        run: shell\vcpkg.bat export

  windows:
    name: windows (modules ${{ matrix.modules }})
    needs: windows-deps
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        modules: [ON, OFF]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: restore vcpkg export
        uses: actions/cache/restore@v4
        with:
          path: engine/vcpkg_win_x64/vcpkg-export
          key: vcpkg-win-x64-${{ hashFiles('project/vcpkg.json') }}
          fail-on-cache-miss: true

      # 这里没有直接调用 shell\win_build.bat：它找不到 vswhere 时会回退到
      # 作者本机的 D:\Program Files\... 路径，在 runner 上不存在。
      # 其余参数(代码页 65001、Ninja、install)与该脚本保持一致。
      #
      # VS 的环境单独用一个 pwsh step 设置。cmd 的每个 step 都是新进程，跨 step
      # 不会继承变量；而且多行 run 里的 `^` 续行在 runner 上不可用(GitHub 把脚本
      # 写成文件再 CALL，续行会报 "The syntax of the command is incorrect")。
      # 这里在子进程里跑 vsdevcmd.bat 拿到它设置的变量，追加到 GITHUB_ENV，
      # 后续 step 会自动继承(INCLUDE / LIB / PATH 都在里面)。
      - name: setup msvc env
        shell: pwsh
        run: |
          $vs_where = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vs_where -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "vswhere cannot find visual studio" }
          Write-Host "visual studio: $installation"
          $dev_cmd = Join-Path $installation "Common7\Tools\vsdevcmd.bat"
          & "${env:COMSPEC}" /s /c "`"$dev_cmd`" -arch=x64 -no_logo && set" | ForEach-Object {
            $name, $value = $_ -split '=', 2
            if ($name -and $value -and $value -notmatch "[\r\n]") {
              Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
            }
          }

      - name: build
        shell: cmd
        run: |
          where cl
          chcp 65001
          cmake -S engine -B server\var\win-x64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_MARIADB=${{ matrix.modules }} -DENABLE_MONGODB=${{ matrix.modules }} -DENABLE_POSTGRESQL=${{ matrix.modules }}
          cmake --build server\var\win-x64
          cmake --install server\var\win-x64

      # setting.lua 和 server/var 都不在版本库里(startup.lua 从工作目录读它)，
      # 这里用样本配置补上；log 目录是测试步骤读汇总行的地方
      - name: prepare runtime
        shell: bash
        run: |
          mkdir -p server/var/log
          cp server/setting/setting_default.lua server/var/setting.lua

      - name: test
        shell: bash
        run: |
          # 测试跑完 master 不会自己退出：后台起服，盯日志里的汇总行，拿到后结束进程。
          # 日志由框架自己写，CI 不重定向也不清理：当前日志恒为 server/var/log/test001
          # (节点名+三位序号，跨天才被改名成 test001YYYYMMDD)
          # filter 是整词匹配，只写 json 会连 mongodb_test 里的 "mongodb json insert..."
          # 一起带进来，所以必须写到 describe 的全名
          ( cd shell && ./win_start.bat test1 --filter "json lib test" ) &
          PID=$!
          for _ in $(seq 1 300); do
            sleep 1
            grep -qE '[0-9]+ passing, [0-9]+ failing' server/var/log/test001 2>/dev/null && break
            kill -0 "$PID" 2>/dev/null || break
          done
          sed -e 's/\x1b\[[0-9;]*m//g' server/var/log/test001 | grep -E '\[  OK\]|\[FAIL\]|passing' | tail -20
          powershell -NoProfile -Command "Get-CimInstance Win32_Process -Filter \"Name='master.exe'\" | Where-Object { \$_.CommandLine -match '--node test1' } | ForEach-Object { taskkill /F /PID \$_.ProcessId }" >/dev/null 2>&1
          grep -qE '[0-9]+ passing, 0 failing' server/var/log/test001

      - name: upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-windows-${{ matrix.modules }}
          path: server/var/log
